kind = "mobile"
previewPath = "/mobile/"
title = "ChargeBridge Mobile"
version = "1.0.0"
id = "artifacts/chargebridge-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21476

[services.development]
run = "pnpm --filter @workspace/chargebridge-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chargebridge-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/chargebridge-mobile", "run", "serve" ]

[services.env]
PORT = "21476"
BASE_PATH = "/mobile/"
